<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sun and Nature</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<div class="cabeçalho">
    <h2> Login de Usuário </h2>
</div>
<div class="conteudo">
<form action="{{url_for('login')}}" method="post">
    <label> Usuário: </label>
    <input type="text" name="username" placeholder="EX: Natalie Portman" style="padding: 8px" required>
    <br>
    <br>
    <label> Senha: </label>
    <input type="password" name="password" style="padding: 8px" required>
    <br>
    <br>
    <button type="submit" style="color: white; background-color: darkolivegreen">
        Entrar
    </button>
    <button type="reset" style="color: white; background-color: darkolivegreen">
        Apagar
    </button>
</form>
</div>
</body>
</html>
